name: Android CI

on:
  push:
    branches: [main, master]
    paths:
      - 'crm-mobile/**'
  pull_request:
    paths:
      - 'crm-mobile/**'

jobs:
  assemble:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crm-mobile
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Configure production API URL
        run: |
          echo "api.base.url=https://guru-crm.onrender.com" >> local.properties

      - name: Assemble debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: androidApp-debug
          path: crm-mobile/androidApp/build/outputs/apk/debug/androidApp-debug.apk
