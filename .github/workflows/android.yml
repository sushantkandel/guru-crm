name: Android CI

on:
  push:
    branches: [main, master]
    paths:
      - 'crm-mobile/**'
  pull_request:
    paths:
      - 'crm-mobile/**'

jobs:
  assemble:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crm-mobile
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Configure flavor properties
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          echo "api.base.url.live=https://guru-crm.onrender.com" >> local.properties
          if [ -n "$GOOGLE_WEB_CLIENT_ID" ]; then
            echo "google.web.client.id=$GOOGLE_WEB_CLIENT_ID" >> local.properties
          fi

      - name: Assemble live debug APK
        run: ./gradlew :androidApp:assembleLiveDebug --no-daemon

      - name: Upload live debug APK
        uses: actions/upload-artifact@v4
        with:
          name: androidApp-live-debug
          path: crm-mobile/androidApp/build/outputs/apk/live/debug/androidApp-live-debug.apk
