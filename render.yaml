# Optional Blueprint — manual setup is easier; see RENDER_SETUP.md
services:
  - type: web
    name: guru-crm-api
    runtime: node
    plan: free
    rootDir: crm-app/backend
    buildCommand: npm install && npm run db:migrate:deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://sushantkandel.github.io/guru-crm
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM
        sync: false
      - key: NOMINATIM_USER_AGENT
        value: SalesGuru/1.0 (admin@crm.com)
